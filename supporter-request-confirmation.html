---
layout: default
include_footer: true
additional_scripts: |
  <script src="assets/js/supporter_request_confirmation.js"></script>
---

<!-- Banner -->
{% include banner.html title='Bestätigung' %}

<!-- Wrapper -->
<section id="wrapper">
    <!-- Content -->
    <div class="wrapper">
        <div class="inner">
            <div
                aria-busy="true"
                class="confirmation-message-wrapper"
                id="confirmation-message-wrapper">
                <h3 id="confirmationMessageTitle">Deine Anfrage wird bestätigt
                </h3>
                <div class="progress-wrapper" id="progress-wrapper">
                    <progress aria-label="Content loading" id="progress-bar"></progress>
                </div>
                <p id="confirmationMessage">Das kann einige Sekunden dauern, kleinen Moment bitte.
                </p>
            </div>
            <a
                class="button small"
                href="/"
                target="_self">Zurück zur Homepage
            </a>
        </div>
    </div>
</section>
