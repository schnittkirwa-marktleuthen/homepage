<!DOCTYPE html>
<html>
    {% include head.html %}

    <body class="is-preload">
        <div id="page-wrapper">
            {% include header.html %} {% include menu.html %} {{ content }}
            {% if page.include_footer == true %}
                {% include footer.html %}
            {% endif %}
        </div>

        {% include scripts.html %}
        {% if page.additional_scripts %}
            {{ page.additional_scripts }}
        {% endif %}
    </body>
</html>
